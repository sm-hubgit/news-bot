name: Realtime news

# يشتغل بدون توقف: يفحص الأخبار كل ٥ دقايق لمدة ~٥ ساعات ونص،
# وبعدها يشغّل نفسه من جديد. الـ schedule موجود كاحتياط.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: realtime-news
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check news every 5 minutes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          end=$((SECONDS + 330 * 60))
          while [ $SECONDS -lt $end ]; do
            start=$SECONDS
            python realtime_bot.py || echo "::warning::run failed, will retry in 5 minutes"
            if [ -n "$(git status --porcelain state.json)" ]; then
              git add state.json
              git commit -q -m "update state"
              git pull --rebase -q && git push -q || echo "::warning::push failed"
            fi
            pause=$((300 - (SECONDS - start)))
            if [ $pause -gt 0 ]; then sleep $pause; fi
          done
          true
      - name: Start next round
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run realtime-news.yml --ref main --repo ${{ github.repository }}
